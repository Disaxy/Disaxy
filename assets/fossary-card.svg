<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title description">
  <title id="title">Fossary featured project</title>
  <desc id="description">Discover, compare, and deploy self-hosted software with reviewed Docker Compose recipes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14231c"/>
      <stop offset="0.62" stop-color="#111d1b"/>
      <stop offset="1" stop-color="#141a27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d8ff65"/>
      <stop offset="1" stop-color="#75f5c4"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#bde1cf" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="900" height="250" rx="22" fill="url(#background)"/>
  <rect width="900" height="250" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="898" height="248" rx="21" fill="none" stroke="#33483d" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <g transform="translate(42 38)">
      <rect width="50" height="50" rx="14" fill="#d8ff65"/>
      <path d="M15 14h23v7H23v7h13v7H23v10h-8z" fill="#15241d"/>
      <text x="68" y="19" fill="#82968a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.5">FEATURED OPEN SOURCE PROJECT</text>
      <text x="68" y="49" fill="#f0f6f2" font-size="27" font-weight="800">Fossary</text>
    </g>

    <text x="42" y="125" fill="url(#accent)" font-size="24" font-weight="750">Discover. Deploy. Own.</text>
    <text x="42" y="156" fill="#aebeb4" font-size="15">Find, compare, and deploy self-hosted software with reviewed</text>
    <text x="42" y="179" fill="#aebeb4" font-size="15">Docker Compose recipes and honest verification status.</text>

    <g transform="translate(559 35)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
      <rect width="299" height="180" rx="14" fill="#0c1513" stroke="#2b4036"/>
      <circle cx="20" cy="19" r="4" fill="#ff6b76"/>
      <circle cx="35" cy="19" r="4" fill="#f4c95d"/>
      <circle cx="50" cy="19" r="4" fill="#64d98b"/>
      <path d="M0 38H299" stroke="#25372f"/>
      <text x="18" y="70" fill="#d8ff65" font-size="12">$ catalogctl validate</text>
      <text x="18" y="98" fill="#70847a" font-size="12">checking catalog...</text>
      <text x="18" y="126" fill="#75f5c4" font-size="12">✓ manifests</text>
      <text x="18" y="149" fill="#75f5c4" font-size="12">✓ recipes</text>
      <text x="18" y="172" fill="#75f5c4" font-size="12">✓ smoke tests</text>
      <rect x="174" y="132" width="104" height="30" rx="8" fill="#d8ff65"/>
      <text x="226" y="152" text-anchor="middle" fill="#15241d" font-size="11" font-weight="800">FOSSARY.COM →</text>
    </g>
  </g>
</svg>
