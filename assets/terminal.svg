<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title description">
  <title id="title">Roman Kholomev terminal profile</title>
  <desc id="description">A terminal window introducing Roman Kholomev as a Python and Go backend engineer.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263b35"/>
      <stop offset="0.48" stop-color="#20304a"/>
      <stop offset="1" stop-color="#37284a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#64f4c4"/>
      <stop offset="0.55" stop-color="#63d8ff"/>
      <stop offset="1" stop-color="#bb8cff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="900" height="320" rx="22" fill="#0b1117"/>
  <rect width="900" height="320" rx="22" fill="url(#grid)"/>
  <rect x="24" y="22" width="852" height="276" rx="15" fill="#111a22" stroke="url(#frame)" stroke-width="2" filter="url(#shadow)"/>
  <path d="M24 65h852" stroke="#2a3742"/>
  <circle cx="50" cy="44" r="6" fill="#ff6b76"/>
  <circle cx="72" cy="44" r="6" fill="#f4c95d"/>
  <circle cx="94" cy="44" r="6" fill="#64d98b"/>
  <text x="450" y="49" fill="#73808c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" text-anchor="middle">roman@github: ~</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
    <text x="52" y="101" fill="#64f4c4">roman@github</text>
    <text x="181" y="101" fill="#66737f">:</text>
    <text x="191" y="101" fill="#63d8ff">~</text>
    <text x="208" y="101" fill="#e8edf2">$ whoami</text>

    <text x="52" y="139" fill="url(#accent)" font-size="29" font-weight="700">Roman Kholomev</text>
    <text x="52" y="172" fill="#b9c4ce">Backend Engineer</text>
    <text x="216" y="172" fill="#596773">/</text>
    <text x="234" y="172" fill="#f4c95d">Python</text>
    <text x="298" y="172" fill="#596773">+</text>
    <text x="316" y="172" fill="#63d8ff">Go</text>

    <text x="52" y="213" fill="#64f4c4">roman@github</text>
    <text x="181" y="213" fill="#66737f">:</text>
    <text x="191" y="213" fill="#63d8ff">~</text>
    <text x="208" y="213" fill="#e8edf2">$ cat focus.txt</text>
    <text x="52" y="248" fill="#b9c4ce">Reliable systems. Developer tools. Open source.</text>
    <rect x="52" y="270" width="10" height="19" rx="1" fill="#64f4c4"/>
  </g>
</svg>
